[platformio]
src_dir = ../../src
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
    +<queue_format.cpp>
    +<ota_progress.cpp>
    +<ota_rollback.cpp>
    +<audio_stream_protocol.cpp>
    +<md5.cpp>
build_flags =
    -std=c++17
    -I ../../src
    -I ../stubs
