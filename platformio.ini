; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; DEVELOPMENT WORKFLOW:
; 1. Edit library in src/ folder
; 2. Run: python3 sync_lib.py (to copy to examples)
; 3. Build: pio run -e esp32dev
;
; For Arduino IDE users, library is in src/ folder

[platformio]
default_envs = esp32dev
src_dir = examples/BasicExample

[common]
lib_deps =
    symlink://.
build_flags =
    -I src
    -I examples/BasicExample
    -I examples/DeviceBillingExample
    -I examples/BatchStateExample
    -I examples/DisplayPINExample
    -I examples/EthernetExample
    -I examples/PushStateExample
    -I examples/ReceiveStateExample
    -I examples/AudioStreamExample
    -I examples/AudioInputStreamExample
    -I examples/SensorExample
    -I examples/MqttOnlyExample
    -I examples/MqttClientExample
monitor_speed = 115200
upload_speed = 576000

; ========================================
; ESP32 
; ========================================
[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}

[env:mqttonly]
extends = env:esp32dev
src_dir = examples/MqttOnlyExample

; The audio example is the only one exercising the WSS stream path; build it so a
; broken audio build is caught here instead of only on a flashed device.
[env:audioexample]
extends = env:esp32dev
src_dir = examples/AudioStreamExample

[env:audioinputexample]
extends = env:esp32dev
src_dir = examples/AudioInputStreamExample

[env:terminalqrexample]
extends = env:esp32dev
src_dir = examples/TerminalQR

; Arduino-ESP32 core 3.x (pioarduino). Core 3.x dropped the bundled
; esp_websocket_client component, so this env is what exercises the vendored copy and
; the std-I2S branch of the audio path. Not in default_envs: opt in when touching
; either, instead of only discovering a core-3.x break on a flashed device.
[env:esp32core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
src_dir = examples/AudioStreamExample

[env:audioinputesp32core3]
extends = env:esp32core3
src_dir = examples/AudioInputStreamExample
